[project]
name = "sparkbricks"
version = "0.1.0"
description = "Databricks connector with multi-auth support (OAuth and PAT)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Marck Vaisman", email = "marck@synaptiq.ai" }
]
keywords = ["databricks", "spark", "databricks-connect", "authentication", "oauth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "databricks-connect>=17.3.0,<18.0.0",
    "databricks-sdk>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]
dotenv = [
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkbricks"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
